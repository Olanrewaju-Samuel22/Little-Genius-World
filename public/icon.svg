<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin for maskable icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Playful decorative background bubbles -->
  <circle cx="80" cy="90" r="32" fill="#FFFFFF" fill-opacity="0.25" />
  <circle cx="430" cy="110" r="44" fill="#FFFFFF" fill-opacity="0.2" />
  <circle cx="90" cy="420" r="28" fill="#FFFFFF" fill-opacity="0.2" />
  <circle cx="440" cy="400" r="36" fill="#FFFFFF" fill-opacity="0.25" />

  <!-- Center Mascot - Little Star Genius -->
  <g filter="url(#shadow)">
    <!-- Main Star Body -->
    <path d="M 256,90 L 295,190 L 405,195 L 320,265 L 350,370 L 256,310 L 162,370 L 192,265 L 107,195 L 217,190 Z" 
          fill="url(#starGrad)" stroke="#F59E0B" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Cute Blush -->
    <ellipse cx="205" cy="255" rx="14" ry="9" fill="#FB7185" fill-opacity="0.7" />
    <ellipse cx="307" cy="255" rx="14" ry="9" fill="#FB7185" fill-opacity="0.7" />

    <!-- Cute Big Friendly Eyes with Highlights -->
    <ellipse cx="218" cy="235" rx="12" ry="16" fill="#1E293B" />
    <circle cx="214" cy="229" r="5" fill="#FFFFFF" />
    <circle cx="222" cy="241" r="2.5" fill="#FFFFFF" />

    <ellipse cx="294" cy="235" rx="12" ry="16" fill="#1E293B" />
    <circle cx="290" cy="229" r="5" fill="#FFFFFF" />
    <circle cx="298" cy="241" r="2.5" fill="#FFFFFF" />

    <!-- Big Happy Smile -->
    <path d="M 236,252 Q 256,275 276,252" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
    <path d="M 242,256 Q 256,274 270,256" fill="#F43F5E" />

    <!-- Tiny Graduation Cap / Little Genius Crown -->
    <polygon points="256,70 310,95 256,115 202,95" fill="#4F46E5" />
    <polygon points="256,115 256,128 290,118 290,105" fill="#4338CA" />
    <circle cx="256" cy="92" r="5" fill="#FDE047" />
    <path d="M 256,92 Q 295,95 295,130" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
    <circle cx="295" cy="132" r="5" fill="#FDE047" />
  </g>
</svg>
